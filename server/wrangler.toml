# Witchspace shared space: one Durable Object per star system.
name = "witchspace-space"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Served at our own address; Cloudflare adds the DNS record on deploy.
routes = [{ pattern = "space.witchspace.org.uk", custom_domain = true }]

[[durable_objects.bindings]]
name = "SYSTEMS"
class_name = "SystemRoom"

[[durable_objects.bindings]]
name = "IDEAS"
class_name = "IdeasBoard"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[durable_objects.bindings]]
name = "CLIPS"
class_name = "ClipBoard"

# SQLite-backed Durable Objects, which the free Workers plan supports.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SystemRoom"]

# The ideas board: one Durable Object with its own SQLite database.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["IdeasBoard"]

# Accounts: email sign-in, callsigns and cloud saves, in one SQLite database.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Accounts"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ClipBoard"]

[observability]
enabled = true

# Web Push: our public VAPID key (the private half is the VAPID_PRIVATE secret).
