name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code, even for pull requests from forks.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Docking computer simulation
        run: npm run sim:docking -- --ci
