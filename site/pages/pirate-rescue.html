      <h1>Witchspace on an iPhone: a jump, a mayday, three pirates</h1>
      <p>One flight on an iPhone, cut down from a single take. It runs in the browser: nothing from the App Store, no download. From Teen I jump to Xeaqu, where the news says there’s plague and medicine is wanted. On the way in to dock, a Cobra calls a mayday. Three Sidewinder pirates tell me to cut my engines. I don’t. The Cobra pays 180 Cr with its thanks, and the docking computer takes me home.</p>
