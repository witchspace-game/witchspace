<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Share card</title>
    <!-- A branded 1200×630 share card, photographed by tools/share-cards.mjs. ?ship=<id>&title=…&sub=… -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #05070d; color: #eef3fa; font-family: Inter, sans-serif; }
      .card { position: relative; width: 1200px; height: 630px; }
      canvas { position: absolute; inset: 0; width: 1200px; height: 630px; }
      .glow { position: absolute; inset: 0; background: radial-gradient(45% 60% at 72% 50%, rgba(61, 255, 176, 0.13), transparent 70%), radial-gradient(35% 45% at 100% 0%, rgba(74, 215, 255, 0.12), transparent 70%), linear-gradient(90deg, rgba(5, 7, 13, 0.92) 0%, rgba(5, 7, 13, 0.6) 46%, rgba(5, 7, 13, 0) 70%); }
      .copy { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 600px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 0.32em; }
      .brand svg { width: 40px; height: 40px; fill: none; stroke: #3dffb0; stroke-width: 2.2; stroke-linejoin: round; filter: drop-shadow(0 0 6px #3dffb0); }
      .kicker { margin-top: auto; color: #3dffb0; font-size: 20px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
      h1 { margin: 10px 0 14px; font-family: 'Space Grotesk', sans-serif; font-size: 68px; line-height: 1.02; letter-spacing: -0.02em; }
      h1.long { font-size: 54px; }
      .sub { margin: 0; color: #b9c6d8; font-size: 26px; line-height: 1.35; }
      .foot { margin-top: 30px; display: flex; gap: 18px; align-items: center; font-size: 20px; color: #95a3b8; white-space: nowrap; }
      .foot b { color: #eef3fa; font-weight: 600; }
      .foot i { width: 6px; height: 6px; border-radius: 50%; background: #3dffb0; box-shadow: 0 0 10px #3dffb0; }
    </style>
  </head>
  <body>
    <div class="card">
      <canvas id="sky"></canvas>
      <div class="glow"></div>
      <div class="copy">
        <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 18 L12 9 L20 9 L28 18 L18 23 L14 23 Z M12 9 L14 23 M20 9 L18 23" /></svg>WITCHSPACE</div>
        <div class="kicker" id="kicker"></div>
        <h1 id="title"></h1>
        <p class="sub" id="sub"></p>
        <div class="foot"><b>witchspace.org.uk</b><i></i><span>Free · open source · plays in your browser</span></div>
      </div>
    </div>
    <script type="module" src="/tools/share-card.ts"></script>
  </body>
</html>
